services:
  db:
    image: postgres:16-alpine
    container_name: gamanat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamanat
      POSTGRES_USER: gamanat
      POSTGRES_PASSWORD: gamanat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamanat"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
