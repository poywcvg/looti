{% extends "base.html" %}{% load static %}
{% block title %}پیدا نشد — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto flex max-w-lg flex-col items-center px-4 py-20 text-center">
  <img src="{% static 'img/illustrations/page-not-found.svg' %}" alt="" class="h-48">
  <h1 class="mt-8 font-display text-2xl font-bold">این صفحه از نقشه بیرون افتاده</h1>
  <p class="mt-3 leading-8 text-espresso-500">ممکن است آگهی فروخته یا حذف شده باشد. از جستجو کمک بگیرید یا به خانه برگردید.</p>
  <div class="mt-8 flex gap-3">
    <a href="{% url 'core:home' %}" class="btn-grad">{% icon "house" "size-4" %}صفحه اصلی</a>
    <a href="{% url 'listings:list' %}" class="btn-ghost">همه آگهی‌ها</a>
  </div>
</div>
{% endblock %}
