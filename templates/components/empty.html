{% load static %}
<div class="flex flex-col items-center px-6 py-14 text-center">
  <img src="{% static 'img/illustrations/' %}{{ image }}.svg" alt="" class="h-40 w-auto opacity-90" loading="lazy">
  <h3 class="mt-6 font-display text-lg font-semibold">{{ title }}</h3>
  {% if text %}<p class="mt-2 max-w-sm text-sm leading-7 text-espresso-500">{{ text }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn-grad is-sm mt-5">{{ action_label }}</a>{% endif %}
</div>
