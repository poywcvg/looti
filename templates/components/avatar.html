{% if u.avatar %}<img src="{{ u.avatar.url }}" alt="" class="{{ size|default:'size-10' }} shrink-0 rounded-full object-cover ring-2 ring-surface">{% else %}<span class="{{ size|default:'size-10' }} grid shrink-0 place-items-center rounded-full bg-gradient-to-br from-saffron-100 to-ember-100 font-display text-sm font-bold text-ember-700 ring-2 ring-surface">{{ u|initials }}</span>{% endif %}
